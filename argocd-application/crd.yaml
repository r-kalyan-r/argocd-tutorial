apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:r-kalyan-r/argocd-tutorial.git
    targetRevision: HEAD
    path: CRD
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
