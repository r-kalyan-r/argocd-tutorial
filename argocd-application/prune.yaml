apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prune-app
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: application
  project: default
  source:
    repoURL: git@github.com:r-kalyan-r/argocd-tutorial.git
    path: prune
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
