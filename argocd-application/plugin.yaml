apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plugin-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'git@github.com:r-kalyan-r/argocd-tutorial.git'
    path: plugins/simple-demo
    targetRevision: main
    plugin:
      name: simple-generator
  destination:
    server: https://kubernetes.default.svc
    namespace: application
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
